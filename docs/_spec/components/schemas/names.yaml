type: object
properties:
  resource-id:
    $ref: ./identifiers.yaml#/resource-id
  alternate-identifiers:
    type: array
    maxItems: 10
    minItems: 1
    items:
      type: object
      properties:
        name:
          $ref: ./identifiers.yaml#/local
        type:
          $ref: ./name-type.yaml
        authority:
          $ref: ./identifiers.yaml#/entity
        mrid:
          $ref: ./identifiers.yaml#/local
      required:
        - name
required:
  - resource-id
