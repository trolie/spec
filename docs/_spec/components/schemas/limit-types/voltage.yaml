overvoltage-threshold-pu:
  type: object
  title: Overvoltage Threshold per unit
  description: >
    An upper limit to voltage for a transmission facility in per unit with
    the base voltage assumed to be the nominal voltage.
  additionalProperties: false
  properties:
    voltage-pu-max: &pu
      type: number
      format: float
      minimum: 0
      maximum: 2
  required:
  - voltage-pu-max

overvoltage-threshold:
  type: object
  title: Overvoltage Threshold
  description: An upper limit to voltage for a transmission facility in kilovolts.
  additionalProperties: false
  properties:
    kV-max: &voltage
      description: The voltage in kilovolts.
      type: number
      format: int32
      minimum: 0
      maximum: 1100
  required:
    - kV-max

undervoltage-threshold-pu:
  type: object
  title: Undervoltage Threshold per unit
  description: >
    An lower limit to voltage for a transmission facility in per unit
    with the nominal voltage assumed to be the base voltage.
  additionalProperties: false
  properties:
    voltage-pu-min:
      <<: *pu
  required:
  - voltage-pu-min

undervoltage-threshold:
  type: object
  title: Undervoltage Threshold
  description: A lower limit to voltage for a transmission facility in kilovolts.
  additionalProperties: false
  properties:
    kV-min:
      <<: *voltage
  required:
    - kV-min

active-power:
  type: object
  title: Active Power
  additionalProperties: false
  properties: &active-power
    mw:
      type: number
      description: Active Power in megawatts
      format: float
      minimum: 1
      maximum: 10000
    kV:
      <<: *voltage
  required:
    - mw

active-power-with-power-factor:
  type: object
  title: Active Power and Power Factor
  additionalProperties: false
  properties:
    <<: *active-power
    pf:
      type: number
      description: Assumed power factor.
      format: float
      minimum: 0
      maximum: 1
  required:
    - mw
    - pf

apparent-power:
  type: object
  title: Apparent Power
  additionalProperties: false
  properties:
    mva:
      type: number
      description: Representation of a limit in megavolt-amperes (MVA).
      format: float
      minimum: 1
      maximum: 10000
    kV:
      <<: *voltage
  required:
    - mva
