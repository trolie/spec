request: &request
  type: object
  description: |
    Request body for creating a monitoring set. The server will assign an id
    and source upon successful creation.
  properties: &props
    name:
      type: string
      description: A human-readable name for this monitoring set
      maxLength: 255
      minLength: 1
      pattern: '^[a-zA-Z0-9 _-]{1,255}$'
    description:
      type: string
      format: free-form
      description: A description of this monitoring set
      maxLength: 1000
    power-system-resources:
      $ref: ./array-max-monitored-elements.yaml#/named-power-system-resources
  required:
  - power-system-resources
  - name

response: &response_v1
  <<: *request
  description: |
    See https://trolie.energy/concepts.html#monitoring-sets for info on the 
    monitoring set concept in TROLIE.  

    This representation is intended to be enough for consumers to read it and tell where 
    the monitoring set came from, using metadata such as a source and an optional description.  
    It also includes the list of resources included in the monitoring set, as well as all
    their known aliases.  

  properties:
    <<: *props
    source:
      $ref: ./data-provenance.yaml
    id:
      $ref: ./identifiers.yaml#/local
  required:
  - source
  - id
  - power-system-resources

response_v2:
  <<: *response_v1
  required:
  - source
  - id
  - name
  - power-system-resources