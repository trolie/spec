forecast-limits-snapshot: &forecast-limit-snapshot
  type: object
  description: A snapshot of the forecast for a monitoring set.
  properties:
    snapshot-header:
      $ref: ./headers.yaml#/forecast-snapshot-header
    limits: &max
      type: array
      minItems: 1
      maxItems: &max-facilities 50000
      description: Set of forecast limits
      items:
        $ref: 'array-max-forecast-periods.yaml#/forecast-limit-item'
  required:
    - snapshot-header
    - limits

forecast-limits-snapshot-slim:
  <<: *forecast-limit-snapshot
  description: A slim snapshot of the forecast for a monitoring set.
  properties: &forecast-limit-snapshot-slim-props
    snapshot-header:
      $ref: ./headers.yaml#/forecast-snapshot-slim-header
    limits:
      <<: *max
      items:
        $ref: 'array-max-forecast-periods.yaml#/resource-forecast-proposal-slim'

forecast-limits-snapshot-slim-inputs-used:
  <<: *forecast-limit-snapshot
  description: |
    A slim snapshot of the forecast for a monitoring set, including the inputs
    that were used to determine the continuous limits.
  properties:
    <<: *forecast-limit-snapshot-slim-props
    inputs-used: &inputs-used-slim
      description: |

        Optional list of quantities used as input to the ratings determination.
        The particular information exchange determines which values may be expected
        as well as the conventions used to represent those values. This property
        is included to prescribe a way to include these inputs.

      type: array
      minItems: 1
      maxItems: 50
      items: &inputs-used-slim-items
        type: object
        properties: &inputs-used-slim-items-props
          name:
            type: string
            format: free-text
            maxLength: 50
          values: &inputs-used-slim-items-props-values
            <<: *max
            description: |
              Since this is expected to be used for wind speed or temperature,
              we expect an array of numbers for each resource. An empty array
              is used to indicate that the inputs are not available for a
              particular resource. This could occur if the inputs were not provided
              by the Ratings Provider or if a recourse rating was utilized.
            items:
              $ref: ./array-max-forecast-periods.yaml#/resource-forecast-inputs
          unit:
            $ref: ./input-used.yaml#/unit
        required:
          - name
          - values
          - unit

forecast-limits-snapshot-elide-psr:
  <<: *forecast-limit-snapshot
  properties:
    snapshot-header:
      $ref: ./headers.yaml#/forecast-snapshot-header-elide-psr
    limits: *max

forecast-limits-detailed-snapshot-elide-psr: &forecast-limit-detailed
  <<: *forecast-limit-snapshot
  description: |

    A detailed snapshot of the forecast for a monitoring set. These details are
    meant to support analysis, archival, and troubleshooting.

  properties: &forecast-limit-detailed-props
    snapshot-header:
      $ref: ./headers.yaml#/forecast-snapshot-header-elide-psr
    limits:
      <<: *max
      description: Forecast including provenance information.
      items:
        $ref: 'array-max-forecast-periods.yaml#/forecast-limit-item-detailed'
    provenance:
      <<: *max
      items:
        type: object
        properties:
          resource-id: &resource-id
            $ref: ./identifiers.yaml#/resource-id
          proposals-considered:
            $ref: './array-max-forecast-periods.yaml#/proposals-considered'
          temporary-aar-exceptions:
            $ref: './array-max-forecast-periods.yaml#/temporary-aar-exceptions'
          overrides:
            $ref: './array-max-forecast-periods.yaml#/overrides'
        required:
          - resource-id
          - proposals-considered
  required:
    - snapshot-header
    - limits
    - provenance

forecast-limits-detailed-snapshot:
  <<: *forecast-limit-detailed
  properties:
    <<: *forecast-limit-detailed-props
    snapshot-header:
      $ref: ./headers.yaml#/forecast-snapshot-header

named-power-system-resources: &psr
  <<: *max
  description: Collection of power system resource names
  items:
    $ref: ./names.yaml

ordered-named-power-system-resources:
  <<: *psr
  description: |

    Ordered array of power system resource names. The order of these items
    determines the order of the ratings proposals in the `ratings` array.

forecast-proposal:
  type: object
  properties:
    proposal-header:
      $ref: ./headers.yaml#/forecast-proposal-header
    ratings:
      <<: *max
      description: Forecasted Ratings
      items:
        $ref: 'array-max-forecast-periods.yaml#/resource-forecast-proposal'
  required:
    - proposal-header
    - ratings

forecast-proposal-slim:
  type: object
  properties:
    proposal-header:
      $ref: ./headers.yaml#/forecast-proposal-slim-header
    ratings:
      <<: *max
      description: Forecasted Ratings
      items:
        $ref: 'array-max-forecast-periods.yaml#/resource-forecast-proposal-slim'
    inputs-used:
      <<: *inputs-used-slim
  required:
    - proposal-header
    - ratings

common-proposal-status:
  type: object
  properties:  &common-proposal-status-props
    incomplete-obligation-count:
      description: |

        The number of facilities for this provider whose Ratings Obligation has
        not been met in this forecast window. This number may be larger than the
        size of `incomplete-facilities`, since the latter has a pre-defined
        upper bound for performance and application security reasons.

        The Ratings Provider should check that this value is zero when they
        believe they have completed their submission process.

      type: integer
      format: uint16
      minimum: 0
      maximum: *max-facilities

    incomplete-obligations: &incomplete-obligations
      type: array
      description: |

        Indicates which Ratings Obligations have not been fulfilled. The size of
        this set is bounded and may be less than the actual count of unfulfilled
        Obligations indicated in `incomplete-obligation-count`. The intended use
        case for this set is debugging and troubleshooting.

      minItems: 0
      maxItems: 10
      items:
        $ref: ./names.yaml

    invalid-proposal-count:
      description: |

        The number of `resource-forecast-proposal` objects that have been
        determined to be *invalid* during this Forecast Window for the current
        Ratings Provider. This count is provided for troubleshooting,
        establishing trends, and triggering alerts.

      type: integer
      format: uint16
      minimum: 0
      maximum: *max-facilities

    proposal-validation-errors:
      type: array
      description: The most recent validation errors
      minItems: 0
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        description: |
          Validation errors.

          Note to implementors, the property `resource-id` intentionally is not `names`
          as was used in `incomplete-obligations` to mitigate the
          possibility of information disclosure when a Ratings Provider
          submits a proposal for a valid resource that they are not
          permitted to write to. It should be the same `resource-id` that
          the client submitted.

        properties:
          message:
            type: string
            pattern: ^(.){1,500}$
            maxLength: 500
            example: The `resource-forecast-proposal` for `8badf00d` is incomplete.
          resource-id:
            <<: *resource-id

  required:
    - incomplete-obligation-count
    - incomplete-obligations
    - invalid-proposal-count
    - proposal-validation-errors

forecast-proposal-status:
  type: object
  description: |

    Status of the rating provider's forecast proposal relative to the current
    forecast window.  Includes any validation errors encountered while
    processing proposals.

  properties:
    <<: *common-proposal-status-props
    source:
      $ref: ./data-provenance.yaml
    begins: # nominates the forecast window
      $ref: ./period-start.yaml

  required:
    - source
    - begins
    - incomplete-obligation-count
    - incomplete-obligations
    - invalid-proposal-count
    - proposal-validation-errors

real-time-proposal-status:
  type: object
  description: |
    Status of the rating provider's real-time obligations.
    Includes any validation errors encountered while processing proposals.
  properties:
    <<: *common-proposal-status-props
    source:
      $ref: ./data-provenance.yaml
  required:
    - source
    - incomplete-obligation-count
    - incomplete-obligations
    - invalid-proposal-count
    - proposal-validation-errors

realtime-limits-snapshot: &realtime-limit-snapshot
  type: object
  description: A snapshot of the realtime limits for a monitoring set.
  properties: &realtime-limit-snapshot-props
    snapshot-header:
      $ref: ./headers.yaml#/real-time-snapshot-header
    limits:
      <<: *max
      description: Real-time limits
      items:
        $ref: './period-limit.yaml#/realtime-snapshot'
  required:
    - snapshot-header
    - limits

realtime-limits-snapshot-slim:
  <<: *realtime-limit-snapshot
  description: A slim snapshot of the realtime limits for a monitoring set.
  properties: &realtime-limit-snapshot-slim-props
    <<: *realtime-limit-snapshot-props
    limits:
      <<: *max
      description: Real-time limits
      items:
        $ref: 'array-max-emergency-ratings.yaml#/slim'

realtime-limits-snapshot-slim-inputs-used:
  <<: *realtime-limit-snapshot
  description: |
    A slim snapshot of the realtime limits for a monitoring set, including the
    inputs used to determine the continuous limits.
  properties:
    <<: *realtime-limit-snapshot-slim-props
    inputs-used:
      <<: *inputs-used-slim
      items:
        <<: *inputs-used-slim-items
        properties:
          <<: *inputs-used-slim-items-props
          values:
            <<: *inputs-used-slim-items-props-values
            description: |
              This is aligned with the `limits` property such that each resource
              entry is in the same position here.

              A null is used to indicate that the input is not available for a
              particular resource. This could occur if the inputs were not provided
              by the Ratings Provider or if a recourse rating was utilized.
            items:
              type: number
              format: float
              nullable: true
  required:
    - snapshot-header
    - limits
    - inputs-used

realtime-limits-snapshot-elide-psr:
  <<: *realtime-limit-snapshot
  properties:
    <<: *realtime-limit-snapshot-props
    snapshot-header:
      $ref: ./headers.yaml#/real-time-snapshot-header-elide-psr

realtime-limits-detailed-snapshot-elide-psr: &realtime-limit-detailed
  <<: *realtime-limit-snapshot
  description: A snapshot of the realtime limits for a monitoring set.
  properties: &realtime-limit-snapshot-detailed-props
    snapshot-header:
      $ref: ./headers.yaml#/real-time-snapshot-header-elide-psr
    limits:
      <<: *max
      description: Real-time limits including provenance.
      items:
        $ref: './period-limit.yaml#/realtime-snapshot-detailed'
    provenance:
      <<: *max
      items:
        type: object
        properties:
          resource-id:
            $ref: ./identifiers.yaml#/resource-id
          proposals-considered: &considered
            type: array
            maxItems: 10
            items:
              $ref: 'period-limit.yaml#/real-time-provenance'
          temporary-aar-exceptions:
            <<: *considered
            items:
              $ref: 'time-bound-static-ratings.yaml#/temporary-aar-exception-provenance'
          overrides:
            <<: *considered
            items:
              $ref: 'time-bound-static-ratings.yaml#/operator-override-limit-provenance'
        required:
          - resource-id
          - proposals-considered
  required:
    - snapshot-header
    - limits
    - provenance

realtime-limits-detailed-snapshot:
  <<: *realtime-limit-detailed
  description: A snapshot of the realtime limits for a monitoring set.
  properties:
    <<: *realtime-limit-snapshot-detailed-props
    snapshot-header:
      $ref: "#/realtime-limits-snapshot/properties/snapshot-header"

realtime-proposal:
  type: object
  properties:
    proposal-header:
      $ref: ./headers.yaml#/real-time-proposal-header
    ratings:
      <<: *max
      description: Real-Time Ratings Proposals
      items:
        $ref: './period-limit.yaml#/real-time-proposal'

    inputs-used:
      <<: *inputs-used-slim
      items:
        type: object
        properties:
          name:
            type: string
            format: free-text
            maxLength: 50
          values:
            <<: *max
            type: array
            description: >
              Since this is expected to be used for wind speed or temperature,
              we expect an array of numbers for each resource. An empty array
              is used to indicate that the inputs are not available for a
              particular resource. This could occur if the inputs were not provided
              by the Ratings Provider or if a recourse rating was utilized.
            items:
              $ref: ./array-max-forecast-periods.yaml#/resource-forecast-inputs
          unit:
            type: string
            description: |
              Since we are not specifying which inputs shall be
              provided, we cannot specify a definitive list of units, but
              implementors are encouraged to use UnitSymbol from CIM when
              appropriate: The CIM may not include appropriate units for
              all inputs, e.g., wind speed, degrees Fahrenheit, etc.
            format: unit
            maxLength: 50
        required:
          - name
          - values
          - unit
  required:
  - proposal-header
  - ratings

realtime-proposal-slim:
  type: object
  description: Used to propose real-time ratings for a set of resources.
  properties:
    proposal-header:
      $ref: ./headers.yaml#/real-time-proposal-slim-header
    ratings:
      <<: *max
      description: Real-Time Ratings Proposals
      items:
        $ref: "array-max-emergency-ratings.yaml#/slim"
    inputs-used:
      <<: *inputs-used-slim
  required:
    - proposal-header
    - ratings

seasonal-ratings-proposal:
  type: object
  properties:
    proposal-header:
      $ref: ./headers.yaml#/seasonal-proposal-header
    ratings:
      <<: *max
      description: Seasonal Ratings proposals
      items:
        $ref: 'array-max-seasons.yaml#/seasonal-proposals'
  required:
    - proposal-header
    - ratings

seasonal-ratings-proposal-slim:
  type: object
  properties:
    proposal-header:
      $ref: ./headers.yaml#/seasonal-proposal-header-slim
    ratings:
      <<: *max
      description: Seasonal Ratings proposals (slim)
      items:
        $ref: 'array-max-seasons.yaml#/seasonal-proposals-slim'
  required:
    - proposal-header
    - ratings

seasonal-ratings-proposal-status:
  type: object
  description: Seasonal rating proposal status
  properties:
    <<: *common-proposal-status-props
    incomplete-obligations:
      <<: *incomplete-obligations
      description: |

        Indicates which Seasonal Ratings Obligations have not been fulfilled.
        The size of this set is bounded and may be less than the actual count of
        unfulfilled Obligations indicated in `incomplete-obligation-count`.
      items:
        $ref: ./array-max-seasons.yaml#/missing-seasonal-obligation
    source:
      $ref: ./data-provenance.yaml
  required:
    - source
    - incomplete-obligation-count
    - invalid-proposal-count

seasonal-ratings-snapshot: &seasonal-rating-snapshot
  type: object
  description: A snapshot of the seasonal ratings for a monitoring set.
  properties: 
    snapshot-header:
      $ref: ./headers.yaml#/common-header
    ratings:
      <<: *max
      items:
        $ref: ./array-max-seasons.yaml#/seasonal-rating-snapshot-item
  required:
    - snapshot-header
    - ratings

seasonal-ratings-snapshot-detailed:
  <<: *seasonal-rating-snapshot
  description: A snapshot of the seasonal ratings for a monitoring set.
  properties:
    snapshot-header:
      $ref: ./headers.yaml#/common-header
    ratings:
      <<: *max
      items:
        $ref: ./array-max-seasons.yaml#/seasonal-rating-snapshot-item-detailed
    provenance:
      <<: *max
      description: Set of seasonal ratings provenance information
      items:
        $ref: './array-max-seasons.yaml#/seasonal-rating-snapshot-provenance-item'
  required:
    - snapshot-header
    - ratings
    - provenance

seasonal-ratings-snapshot-detailed-elide-psr:
  <<: *seasonal-rating-snapshot
  description: A snapshot of the seasonal ratings for a monitoring set.
  properties:
    snapshot-header:
      $ref: ./headers.yaml#/base-header
    ratings:
      $ref: "#/seasonal-ratings-snapshot-detailed/properties/ratings"
    provenance:
      description: Set of seasonal ratings provenance information
      items:
        $ref: './array-max-seasons.yaml#/seasonal-rating-snapshot-provenance-item'
  required:
    - snapshot-header
    - ratings
    - provenance

temporary-aar-exception-set:
  type: array
  minItems: 0
  maxItems: *max-facilities
  items:
    $ref: ./time-bound-static-ratings.yaml#/temporary-aar-exception

seasonal-override-set:
  type: array
  minItems: 0
  maxItems: *max-facilities
  items:
    $ref: ./time-bound-static-ratings.yaml#/seasonal-override
