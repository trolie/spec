forecast-limit-item: &limit
  type: object
  additionalProperties: false
  properties:
    resource-id: &id
      $ref: ./resource-id.yaml
    periods: &periods
      type: array
      maxItems: 300
      items:
        $ref: 'forecast-limit-period.yaml#/snapshot'
  required:
    - resource-id
    - periods

forecast-limit-item-detailed:
  <<: *limit
  properties:
    resource-id: *id
    periods:
      <<: *periods
      items:
        $ref: 'forecast-limit-period.yaml#/snapshot-detailed'

resource-forecast-proposal:
  <<: *limit
  properties:
    resource-id: *id
    periods:
      <<: *periods
      items:
        $ref: 'forecast-limit-period.yaml#/proposal'

resource-forecast-proposal-slim:
  <<: *periods
  items:
    $ref: 'array-max-emergency-ratings.yaml#/slim'

resource-forecast-inputs:
  <<: *periods
  items:
    type: number
    format: float

missing-forecast:
  <<: *limit
  properties:
    resource-id: *id
    periods:
      <<: *periods
      items:
        $ref: ./period-start.yaml

proposals-considered: &considered
  type: array
  maxItems: 1200 # 300 periods * 4 proposals per period
  items:
    $ref: 'proposal-considered.yaml#/forecast'

temporary-aar-exceptions:
  <<: *considered # 1200 active exceptions across a footprint in a 10-day window
  items:
    $ref: 'time-bound-static-ratings.yaml#/temporary-aar-exception-provenance'

overrides:
  <<: *considered # 1200 active overrides across a footprint in a 10-day window
  items:
    $ref: 'time-bound-static-ratings.yaml#/operator-override-limit-provenance'
