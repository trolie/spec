period: &period
  type: object
  properties: &period-props
    period-start:
      $ref: ./period-start.yaml
    period-end:
      $ref: ./period-start.yaml
  required:
    - period-start
    - period-end

limit-data: &limit-data
  type: object
  properties: &limit-data-properties
    continuous-operating-limit:
      $ref: ./limit.yaml
    emergency-operating-limits:
      $ref: ./array-max-emergency-durations.yaml#/limit-value-set
    limiting-analysis:
      $ref: ./limiting-analysis.yaml
  required:
    - continuous-operating-limit
    - emergency-operating-limits

forecast-snapshot: &forecast-snapshot
  <<: *period
  properties: &forecast-snapshot-props
    <<: [*period-props, *limit-data-properties]
  required: &forecast-snapshot-required
    - period-start
    - period-end
    - continuous-operating-limit
    - emergency-operating-limits

forecast-snapshot-detailed:
  <<: *forecast-snapshot
  properties:
    <<: *forecast-snapshot-props
    additional-data: &additional-data
      type: object
      description: |
        Implementors may use this object to provide freeform extensions with
        additional traceability / provenance data to be included with the limit.
        Schema of this object is out of scope of the TROLIE specification.

realtime-snapshot: &rt-normal
  type: object
  properties: &rt-normal-props
    <<: *limit-data-properties
    resource-id:
      $ref: ./resource-id.yaml
  required: &rt-normal-required
    - resource-id
    - continuous-operating-limit
    - emergency-operating-limits

realtime-snapshot-detailed:
  <<: *rt-normal
  properties:
    <<: *rt-normal-props
    additional-data: *additional-data
  required: *rt-normal-required

proposal: &proposal
  <<: *limit-data
  properties: &proposal-props
    <<: *limit-data-properties
    current-source:
      $ref: ./quality-class-current-source.yaml
    inputs-used:
      description: |

        Optional list of quantities used as input to the ratings determination.
        The particular information exchange determines which values may be expected
        as well as the conventions used to represent those values. This property
        is included to prescribe a way to include these inputs.

      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        properties:
          name:
            type: string
            format: free-text
            maxLength: 50
          value:
            type: object
            description: >
              This could be any value: a bit, float, integer, string, etc.
          unit:
            type: string
            description: |
              If the `value` is dimensionless, this property should not be
              provided. Since we are not specifying which inputs shall be
              provided, we cannot specify a definitive list of units, but
              implementors are encouraged to use UnitSymbol from CIM when
              appropriate: The CIM may not include appropriate units for
              all inputs, e.g., wind speed, degrees Fahrenheit, etc.
            format: unit
            maxLength: 50
        required:
          - name
          - value

real-time-proposal: &real-time-proposal
  <<: *proposal
  properties: &real-time-proposal-props
    <<: [*rt-normal-props, *proposal-props]
  required: *rt-normal-required

forecast-proposal: &forecast-proposal
  <<: *proposal
  title: Forecasted Period
  description: |
    A Forecasted Period contains proposed limits for a power system object,
    e.g., a segment, that were forecasted for a particular Period in a Forecast
    Window. The status of the proposal as determined by the Clearinghouse is
    also included.
  properties: &forecast-proposal-props
    <<: [*period-props, *proposal-props]
  required: *forecast-snapshot-required

provenance:
  type: object
  properties: &provenance-props
    source:
      $ref: ./data-provenance.yaml
    proposal-disposition:
      description: |

        Despite a proposal being accepted by TROLIE, the downstream
        Clearinghouse logic may still disqualify a proposal. This might
        occur if, for example, the upper and lower reasonability limits are
        not aligned between TROLIE and the Clearinghouse.  To aid
        troubleshooting, the specification requires that TROLIE instances
        explicitly indicate if the proposal was `Used` in the determination
        of the limit or was `Rejected`.

      type: string
      enum:
        - Used
        - Rejected
    resource-id:
      $ref: ./resource-id.yaml
  required:
    - source
    - proposal-disposition

forecast-provenance:
  <<: *forecast-proposal
  description: >
    Details a proposal that was considered by the Clearinghouse run.
    If `resource-id` is not provided, the ratings data is assumed to be for the
    overall facility.
  properties:
    <<: [*forecast-proposal-props, *provenance-props]
  required:
    - period-start
    - period-end
    - continuous-operating-limit
    - emergency-operating-limits
    - source
    - proposal-disposition

real-time-provenance:
  <<: *real-time-proposal
  properties:
    <<: [*real-time-proposal-props, *provenance-props]
  required:
    - resource-id
    - continuous-operating-limit
    - emergency-operating-limits
    - source
    - proposal-disposition
