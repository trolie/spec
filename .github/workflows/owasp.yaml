name: 'OWASP Spectral lint'

on:
  workflow_dispatch:
  push:
    branches:
      - 1.0*
  pull_request:
    branches:
      - 1.0*

permissions:
  contents: read

jobs:
  build:
    name: "Bundle and Lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint
        run: >-
          cd docs &&
          npx --yes @redocly/cli bundle -d ./_spec/openapi-split.yaml -o ./openapi-1.0.yaml &&
          cp ../.spectral.yaml . &&
          npx --yes @stoplight/spectral-cli lint docs/openapi-1.0.yaml --ruleset .spectral.yaml --verbose
