name: 'OpenAPI lint'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 1.0*

permissions:
  contents: read

jobs:
  build:
    name: "Redocly Lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: >-
          npx --yes @redocly/cli bundle -d ./docs/_spec/openapi-split.yaml -o ./docs/openapi-1.0.yaml &&
          npx @redocly/cli lint ./docs/openapi-1.0.yaml
      - name: Redocly API Stats
        id: api_stats
        run: npx @redocly/cli stats ./docs/openapi-1.0.yaml > stats.txt 2>&1
      - name: Comment PR with API Stats
        #if: ${{ github.event.pull_request }}
        if: ${{ false }}
        uses: thollander/actions-comment-pull-request@v2.4.3
        with:
          comment_tag: api-stats
          filePath: stats.txt
